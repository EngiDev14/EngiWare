<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Lectures</title>

    <link rel="stylesheet"
          href="../css/style.css">

</head>

<body class="subjects-page">

<button class="back-btn"
onclick="history.back()">
    ← Back
</button>

<button class="theme-btn"
onclick="toggleTheme()">
    🌙
</button>

<div class="subjects-container">

    <h1>🎥 Lectures</h1>

    <div class="resource-grid"
         id="lectureContainer">

    </div>

</div>

<script src="../js/script.js"></script>

<script type="module">

// ================= Firebase =================

import { db }
from "../js/firebase.js";

import {

collection,
getDocs

}

from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

// ================= Load Lectures =================

(async () => {

const branch =
localStorage.getItem("branch");

const semester =
localStorage.getItem("semester");

const subject =
localStorage.getItem("subject");

const container =
document.getElementById("lectureContainer");

if(!branch || !semester || !subject){

container.innerHTML = `

<div class="resource-card">

Invalid Selection ❌

</div>

`;

return;

}

container.innerHTML = "";

const snapshot =
await getDocs(collection(db,"lectures"));

let found = false;

snapshot.forEach((doc)=>{

const lecture = doc.data();

if(

lecture.branch.toLowerCase() === branch.toLowerCase() &&

lecture.semester.toLowerCase() === semester.toLowerCase() &&

lecture.subject.toLowerCase() === subject.toLowerCase()

){

found = true;

container.innerHTML += `

<a
href="${lecture.lectureUrl}"
target="_blank"
class="resource-card">

🎥 ${lecture.title}

</a>

`;

}

});

if(!found){

container.innerHTML = `

<div class="resource-card">

Lectures Coming Soon 🚀

</div>

`;

}

})();

</script>

</body>
</html>
