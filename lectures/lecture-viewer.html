<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Lectures</title>

    <link rel="stylesheet"
          href="../css/style.css">

</head>

<body class="subjects-page">

<button class="back-btn"
onclick="history.back()">
    ← Back
</button>

<button class="theme-btn"
onclick="toggleTheme()">
    🌙
</button>

<div class="subjects-container">

    <h1>🎥 Lectures</h1>

    <div class="resource-grid"
         id="lectureContainer">

    </div>

</div>

<script src="../js/script.js"></script>

<script type="module">

// ================= Firebase =================

import { db } from "../js/firebase.js";

import {
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


// ================= Load Lectures =================

(async () => {

    const container = document.getElementById("lectureContainer");

    try {

        const branch = localStorage.getItem("branch");
        const semester = localStorage.getItem("semester");
        const subject = localStorage.getItem("subject");

        console.log("Branch:", branch);
        console.log("Semester:", semester);
        console.log("Subject:", subject);

        if (!branch || !semester || !subject) {

            container.innerHTML = `
                <div class="resource-card">
                    Invalid Selection ❌
                </div>
            `;

            return;
        }


        container.innerHTML = `
            <div class="resource-card">
                Loading lectures... ⏳
            </div>
        `;


        const snapshot = await getDocs(collection(db, "lectures"));

        console.log("Total lectures:", snapshot.size);

        let found = false;

        container.innerHTML = "";


        snapshot.forEach((doc) => {

            const lecture = doc.data();

            console.log("Lecture data:", lecture);


            if (

                String(lecture.branch).toLowerCase() ===
                String(branch).toLowerCase()

                &&

                String(lecture.semester).toLowerCase() ===
                String(semester).toLowerCase()

                &&

                String(lecture.subject).toLowerCase() ===
                String(subject).toLowerCase()

            ) {

                found = true;

                container.innerHTML += `

                    <a
                        href="${lecture.lectureUrl}"
                        target="_blank"
                        class="resource-card">

                        🎥 ${lecture.title}

                    </a>

                `;

            }

        });


        if (!found) {

            container.innerHTML = `
                <div class="resource-card">
                    Lectures Coming Soon 🚀
                </div>
            `;

        }

    }

    catch (error) {

        console.error("Lecture loading error:", error);

        container.innerHTML = `
            <div class="resource-card">
                Error loading lectures ❌
                <br><br>
                Check browser console (F12).
            </div>
        `;

    }

})();

</script>

</body>
</html>
