<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Quiz Topics | EngiWare</title>

<link rel="stylesheet"
href="css/style.css">

</head>

<body class="subjects-page">

<button
class="back-btn"
onclick="history.back()">
← Back
</button>

<button
class="theme-btn"
onclick="toggleTheme()">
🌙
</button>

<div class="subjects-container">

    <h1 id="quizTitle">

        🎯 Quiz Topics

    </h1>

<div class="quiz-subtitle-card">

    <span class="quiz-subtitle-icon">
        🚀
    </span>

    <p id="quizSubtitle">
        Select a topic to start practicing
    </p>

</div>

    <div
    id="quizContainer"
    class="semester-grid">

    </div>

</div>

<script src="js/script.js"></script>

<script>

const branch =
localStorage.getItem("branch");

const semester =
localStorage
.getItem("semester");

const subject =
localStorage
.getItem("subject");


document
.getElementById("quizTitle")
.innerHTML =
"🎯 " + subject + " Quizzes";

const script =
document.createElement("script");


script.src =
`quizzes/${branch.toLowerCase()}.js`;


script.onload = () => {

    loadQuizTopics();

};

script.onerror = () => {

    document
    .getElementById("quizContainer")
    .innerHTML = `

        <div class="resource-card">

            ❌ Quiz data could not be loaded.

        </div>

    `;

};

document.body.appendChild(script);

function loadQuizTopics(){

    const container =
    document.getElementById("quizContainer");


    container.innerHTML = "";


    if(!branch || !semester || !subject){

        showNoQuiz();

        return;

    }


    const semesterKey =
    semester
    .replace(/\s/g, "")
    .toLowerCase();


    const semesterData =
    quizData[semesterKey];


    console.log("Branch:", branch);
    console.log("Semester:", semester);
    console.log("Semester Key:", semesterKey);
    console.log("Subject:", subject);
    console.log("Semester Data:", semesterData);


    if(!semesterData){
        showNoQuiz();
        return;
    }

    const subjectData =
    semesterData[subject];

    console.log("Subject Data:", subjectData);

    if(!subjectData){
        showNoQuiz();
        return;
    }

    // ================= OLD QUIZ FORMAT =================

    if(Array.isArray(subjectData)){
        if(subjectData.length === 0){
            showNoQuiz();
            return;
        }

        container.innerHTML = `

        <button
        class="semester-btn"
        onclick="startQuizTopic('General Quiz')">
            📚 General Quiz
            <br>
            <small>
                ${subjectData.length} Questions
            </small>
        </button>
        `;
        return;
    }


    // ================= NEW TOPIC FORMAT =================

    const topics =
    Object.keys(subjectData);

    if(topics.length === 0){
        showNoQuiz();
        return;
    }

    topics.forEach(topic => {

        const questionCount =
        subjectData[topic].length;

        container.innerHTML += `

        <button
        class="quiz-topic-card"
        onclick='startQuizTopic(${JSON.stringify(topic)})'>

            <div class="quiz-topic-icon">
                📘
            </div>

            <div class="quiz-topic-name">
                ${topic}
            </div>

            <div class="quiz-topic-count">
                ${questionCount} Questions
            </div>

            <div class="quiz-topic-arrow">
                →
            </div>

        </button>

        `;

    });

}

window.startQuizTopic = function(topic){

    console.log("TOPIC CLICKED:", topic);

    localStorage.setItem(
        "quizTopic",
        topic
    );

    console.log(
        "SAVED TOPIC:",
        localStorage.getItem("quizTopic")
    );

    window.location.href =
    "quiz/quiz-player.html";

}

function showNoQuiz(){

    document
    .getElementById("quizContainer")
    .innerHTML = `

    <div class="resource-card">

        <h2>

            🚧 No Quizzes Available Yet

        </h2>

        <p>

            Quizzes for this subject
            will be added soon 🚀

        </p>

    </div>

    `;

}

</script>

</body>

</html>
