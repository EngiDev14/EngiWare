<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CSE Semester 2 Subjects</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="subjects-page">

<button class="back-btn"
        onclick="history.back()">
    ← Back
</button>

<button class="theme-btn"
        onclick="toggleTheme()">
    🌙
</button>

<div class="subjects-container">

    <h1>CSE - Semester 2</h1>

    <div class="subject-grid">
           <div class="resource-card"
            onclick="openSyllabus()">
            📝 Syllabus
        </div>


        <button class="subject-card"
        onclick="openSubject('Applied Mathematics - II')">
            📘 Applied Mathematics - II
        </button>

        <button class="subject-card"
        onclick="openSubject('Applied Physics')">
            🧪 Applied Physics
        </button>

        <button class="subject-card"
         onclick="openSubject('Object-Oriented Programming')">
            💻 Object-Oriented Programming
        </button>

        <button class="subject-card"
        onclick="openSubject('Basic Electronics Engineering')">
            ⚙️ Basic Electronics Engineering
        </button>

        <button class="subject-card"
        onclick="openSubject('Manufacturing Processes')">
            🌐 Manufacturing Processes
        </button>

      
    </div>

</div>

<script src="js/script.js"></script>

</body>
</html>
