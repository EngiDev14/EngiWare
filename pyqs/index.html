<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PYQs</title>

    <link rel="stylesheet"
          href="../css/style.css">

</head>

<body class="subjects-page">

<button class="back-btn"
onclick="history.back()">
    ← Back
</button>

<button class="theme-btn"
onclick="toggleTheme()">
    🌙
</button>

<div class="subjects-container">

    <h1>📝 Previous Year Questions</h1>

    <div class="resource-grid"
         id="pyqContainer">

    </div>

</div>

<script src="../js/script.js"></script>

<script type="module">

console.log("PYQ Module Loaded");

// ================= Firebase =================

import { db }
from "../js/firebase.js";

import {

collection,
getDocs

}

from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

// ================= Load PYQs =================

(async()=>{

try{

const branch =
localStorage.getItem("branch");

const semester =
localStorage.getItem("semester");

const subject =
localStorage.getItem("subject");

const container =
document.getElementById("pyqContainer");

if(!branch || !semester || !subject){

container.innerHTML = `

<div class="resource-card">

Invalid Selection ❌

</div>

`;

return;

}

container.innerHTML = "";

const snapshot =
await getDocs(collection(db,"pyqs"));

let found = false;

snapshot.forEach((doc)=>{

const pyq = doc.data();

if(

pyq.branch.toLowerCase() === branch.toLowerCase() &&

pyq.semester.toLowerCase() === semester.toLowerCase() &&

pyq.subject.toLowerCase() === subject.toLowerCase()

){

found = true;

container.innerHTML += `

<a
href="${pyq.pdfUrl}"
target="_blank"
class="resource-card">

📄 ${pyq.title}

</a>

`;

}

});

if(!found){

container.innerHTML = `

<div class="resource-card">

PYQs Coming Soon 🚀

</div>

`;

}

}

catch(error){

console.error(error);

}

})();

</script>

</body>
</html>
