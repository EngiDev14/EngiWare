<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSE Semester 3</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="subjects-page">

    <button class="back-btn" onclick="history.back()">
        ← Back
    </button>

    <button class="theme-btn" onclick="toggleTheme()">
        🌙
    </button>

    <div class="subjects-container">

        <h1>CIVIL - Semester 3</h1>

        <div class="subject-grid">
              <div class="resource-card"
            onclick="openSyllabus()">
            📝 Syllabus
        </div>

            <button class="subject-card"
            onclick="openSubject('Computer Networks')">
                🌐 Computer Networks
            </button>

            <button class="subject-card"
            onclick="openSubject('Data Structures and Algorithms')">
                📊 Data Structures and Algorithms
            </button>

            <button class="subject-card"
             onclick="openSubject('Discrete Mathematics')">
                🔢 Discrete Mathematics
            </button>

            <button class="subject-card"
            onclick="openSubject('Environmental Science')">
                🌱 Environmental Science
            </button>

            <button class="subject-card"
            onclick="openSubject('Punjabi')">
                🗣️ Punjabi
            </button>

            <button class="subject-card"
            onclick="openSubject('Python Programming')">
                🐍 Python Programming
            </button>

                  

        </div>

    </div>

    <script src="js/script.js"></script>

</body>
</html>
