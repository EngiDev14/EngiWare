<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>My Profile</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/profile.css">

</head>

<body class="subjects-page"
data-title="👤 My Profile">

<div id="navbar"></div>

<div id="overlay"
onclick="closeSidebar()"></div>

<aside id="sidebar"></aside>

<!------------ PROFILE CHANGES AND UPDATES ------------>

<div class="subjects-container">

<div class="profile-wrapper">

<div class="profile-header">

<div class="profile-avatar-container">

    <!-- PROFILE IMAGE ADDITION -->

<div class="profile-avatar">

<img
id="profileImagePreview"
src="images/default-profile.png"
alt="Profile Picture">

</div>

<label for="profileImageInput" class="camera-btn">
📷
</label>

<input
type="file"
id="profileImageInput"
accept="image/*"
hidden>

</div>

<h1 id="welcomeName">
Welcome Back
</h1>

<p>
Manage your EngiWare profile
</p>

</div>

<div class="profile-info-card">

<h2>📋 Profile Information</h2>

<div class="profile-info">

<div class="info-item">
<span>Name</span>
<p id="displayName">-</p>
</div>

<div class="info-item">
<span>Email</span>
<p id="displayEmail">-</p>
</div>

<div class="info-item">
<span>College</span>
<p id="displayCollege">-</p>
</div>

<div class="info-item">
<span>Branch</span>
<p id="displayBranch">-</p>
</div>

<div class="info-item">
<span>Semester</span>
<p id="displaySemester">-</p>
</div>

</div>

</div>

<div class="profile-edit-card">

<h2>✏ Edit Profile</h2>

<input
type="text"
id="profileName"
placeholder="Your Name">

<input
type="text"
id="profileCollege"
placeholder="College Name">

<input
type="text"
id="profileBranch"
placeholder="Branch">

<input
type="text"
id="profileSemester"
placeholder="Semester">

<button id="saveProfileBtn">
💾 Save Changes
</button>

</div>

</div>

</div>

<div id="toast" class="toast"></div>

<script src="js/script.js"></script>
<script src="js/components.js"></script>
<script type="module"
src="js/profile.js"></script>

</body>

</html>
